<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardWallet Redis 可视化管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
  
  /* 顶部栏 */
  .topbar { background: #1a1d29; padding: 16px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #2a2d3a; position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 18px; color: #4fc3f7; white-space: nowrap; }
  .topbar .config-btn { margin-left: auto; padding: 8px 16px; background: #2a2d3a; color: #e0e0e0; border: 1px solid #3a3d4a; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .topbar .config-btn:hover { background: #353846; }
  .topbar .status { font-size: 12px; color: #888; }
  .topbar .status.ok { color: #4caf50; }
  .topbar .status.err { color: #f44336; }

  /* 配置弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-mask.hidden { display: none; }
  .modal { background: #1a1d29; border-radius: 12px; padding: 24px; width: 460px; max-width: 90vw; border: 1px solid #2a2d3a; }
  .modal h2 { font-size: 16px; margin-bottom: 16px; color: #4fc3f7; }
  .modal label { display: block; font-size: 12px; color: #888; margin: 12px 0 4px; }
  .modal input { width: 100%; padding: 10px 12px; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #e0e0e0; font-size: 13px; font-family: monospace; }
  .modal input:focus { outline: none; border-color: #4fc3f7; }
  .modal .btns { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .modal .btn { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; border: none; }
  .modal .btn-primary { background: #4fc3f7; color: #0f1117; }
  .modal .btn-ghost { background: #2a2d3a; color: #e0e0e0; border: 1px solid #3a3d4a; }

  /* 主布局 */
  .main { display: flex; gap: 1px; background: #2a2d3a; min-height: calc(100vh - 57px); }
  
  /* 侧边栏 */
  .sidebar { width: 280px; background: #131620; padding: 16px; overflow-y: auto; }
  .sidebar h3 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
  .key-list { list-style: none; }
  .key-list li { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: monospace; display: flex; align-items: center; gap: 8px; }
  .key-list li:hover { background: #1a1d29; }
  .key-list li.active { background: #1a1d29; color: #4fc3f7; }
  .key-type { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #2a2d3a; color: #888; }
  .key-type.string { color: #4caf50; }
  .key-type.list { color: #ff9800; }
  .key-type.hash { color: #e91e63; }
  .sidebar .refresh-btn { width: 100%; padding: 8px; background: #2a2d3a; color: #e0e0e0; border: 1px solid #3a3d4a; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 12px; }
  .sidebar .refresh-btn:hover { background: #353846; }
  .scan-input { width: 100%; padding: 8px 10px; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #e0e0e0; font-size: 12px; margin-bottom: 12px; }
  .scan-input:focus { outline: none; border-color: #4fc3f7; }

  /* 内容区 */
  .content { flex: 1; background: #0f1117; padding: 24px; overflow-y: auto; }
  .content h2 { font-size: 16px; margin-bottom: 16px; color: #4fc3f7; font-family: monospace; word-break: break-all; }
  
  /* 数据卡片 */
  .data-card { background: #1a1d29; border: 1px solid #2a2d3a; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .data-card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .data-card .value { font-size: 14px; color: #e0e0e0; font-family: monospace; word-break: break-all; white-space: pre-wrap; }
  .data-card .value.json { background: #0f1117; padding: 12px; border-radius: 6px; border: 1px solid #2a2d3a; max-height: 400px; overflow-y: auto; }
  
  /* 操作按钮 */
  .actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .actions button { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid #3a3d4a; background: #2a2d3a; color: #e0e0e0; }
  .actions button:hover { background: #353846; }
  .actions button.danger { border-color: #f44336; color: #f44336; }
  .actions button.danger:hover { background: #3a1515; }
  .actions button.primary { background: #4fc3f7; color: #0f1117; border-color: #4fc3f7; }

  /* 统计卡片 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #1a1d29; border: 1px solid #2a2d3a; border-radius: 8px; padding: 16px; }
  .stat-card .num { font-size: 28px; font-weight: 700; color: #4fc3f7; }
  .stat-card .name { font-size: 12px; color: #888; margin-top: 4px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1d29; border: 1px solid #3a3d4a; padding: 12px 24px; border-radius: 8px; font-size: 13px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { border-color: #4caf50; color: #4caf50; }
  .toast.error { border-color: #f44336; color: #f44336; }

  /* 空状态 */
  .empty { text-align: center; padding: 60px 20px; color: #666; }
  .empty p { font-size: 14px; margin-top: 8px; }

  /* 加载 */
  .loading { text-align: center; padding: 40px; color: #666; font-size: 13px; }

  /* 编辑器 */
  .editor { width: 100%; min-height: 120px; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #e0e0e0; padding: 12px; font-family: monospace; font-size: 13px; resize: vertical; }
  .editor:focus { outline: none; border-color: #4fc3f7; }

  /* 列表项 */
  .list-item { background: #1a1d29; border: 1px solid #2a2d3a; border-radius: 6px; padding: 12px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; }
  .list-item .idx { font-size: 11px; color: #666; min-width: 28px; padding-top: 2px; }
  .list-item .val { flex: 1; font-family: monospace; font-size: 13px; word-break: break-all; white-space: pre-wrap; }
  .list-item .del-btn { padding: 4px 8px; font-size: 11px; background: #3a1515; color: #f44336; border: 1px solid #f44336; border-radius: 4px; cursor: pointer; white-space: nowrap; }

  /* 响应式 */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 300px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>💳 CardWallet Redis 管理台</h1>
  <span class="status" id="status">未连接</span>
  <button class="config-btn" onclick="openConfig()">⚙ 配置</button>
</div>

<!-- 配置弹窗 -->
<div class="modal-mask hidden" id="configModal">
  <div class="modal">
    <h2>Upstash Redis 连接配置</h2>
    <label>REST URL</label>
    <input type="text" id="cfgUrl" placeholder="https://xxx.upstash.io" />
    <label>REST Token</label>
    <input type="password" id="cfgToken" placeholder="AXxxxx..." />
    <label>管理员密码（可选，用于云函数 API）</label>
    <input type="password" id="cfgAdminPwd" placeholder="管理员密码" />
    <label>云函数地址（可选，用于 admin API）</label>
    <input type="text" id="cfgCloudUrl" placeholder="https://xxx.tcloudbase.com" />
    <div class="btns">
      <button class="btn btn-ghost" onclick="closeConfig()">取消</button>
      <button class="btn btn-primary" onclick="saveConfig()">保存并连接</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- 侧边栏：Key 列表 -->
  <div class="sidebar">
    <input type="text" class="scan-input" id="scanInput" placeholder="搜索 key（回车）" onkeydown="if(event.key==='Enter')scanKeys()" />
    <button class="refresh-btn" onclick="scanKeys()">🔄 刷新 Key 列表</button>
    <h3>Keys (<span id="keyCount">0</span>)</h3>
    <ul class="key-list" id="keyList">
      <li style="color:#666;cursor:default">请先配置连接</li>
    </ul>
  </div>

  <!-- 内容区 -->
  <div class="content" id="content">
    <div class="empty">
      <p style="font-size:32px">🗄️</p>
      <p>选择左侧 Key 查看数据，或点击「⚙ 配置」连接 Upstash Redis</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let cfg = { url: '', token: '', adminPwd: '', cloudUrl: '' };
let knownKeys = [];

// === 初始化 ===
  const saved = localStorage.getItem('cardwallet.redisAdmin');
  if (saved) {
    cfg = JSON.parse(saved);
    if (cfg.url && cfg.token) {
      document.getElementById('cfgUrl').value = cfg.url;
      document.getElementById('cfgToken').value = cfg.token;
      document.getElementById('cfgAdminPwd').value = cfg.adminPwd || '';
      document.getElementById('cfgCloudUrl').value = cfg.cloudUrl || '';
      scanKeys();
    } else {
      openConfig();
    }
  } else {
    openConfig();
  }
})();

// === 配置 ===
function openConfig() {
  document.getElementById('configModal').classList.remove('hidden');
}
function closeConfig() {
  document.getElementById('configModal').classList.add('hidden');
}
function saveConfig() {
  cfg.url = document.getElementById('cfgUrl').value.trim().replace(/\/$/, '');
  cfg.token = document.getElementById('cfgToken').value.trim();
  cfg.adminPwd = document.getElementById('cfgAdminPwd').value.trim();
  cfg.cloudUrl = document.getElementById('cfgCloudUrl').value.trim().replace(/\/$/, '');
  if (!cfg.url || !cfg.token) { toast('请填写 URL 和 Token', 'error'); return; }
  localStorage.setItem('cardwallet.redisAdmin', JSON.stringify(cfg));
  closeConfig();
  scanKeys();
}

// === Upstash Redis REST API ===
async function redisCmd(path, method, body) {
  const url = cfg.url + path;
  const opts = { method: method || 'GET', headers: { Authorization: 'Bearer ' + cfg.token } };
  if (body !== undefined) {
    opts.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.result;
}

// === SCAN keys ===
async function scanKeys() {
  if (!cfg.url) { openConfig(); return; }
  const pattern = document.getElementById('scanInput').value.trim() || '*';
  const statusEl = document.getElementById('status');
  statusEl.className = 'status';
  statusEl.textContent = '扫描中...';

  const listEl = document.getElementById('keyList');
  listEl.innerHTML = '<li style="color:#666;cursor:default">扫描中...</li>';

  try {
    // 使用 SCAN 0 COUNT 1000 MATCH pattern
    const result = await redisCmd('/scan/0/match/' + encodeURIComponent(pattern) + '/count/1000');
    let keys = [];
    if (Array.isArray(result)) {
      // Upstash 返回 [cursor, [keys]]
      keys = Array.isArray(result[1]) ? result[1] : result;
    } else if (typeof result === 'string') {
      keys = result.split('\n').filter(Boolean);
    }
    keys.sort();
    knownKeys = keys;
    document.getElementById('keyCount').textContent = keys.length;
    statusEl.className = 'status ok';
    statusEl.textContent = '已连接 · ' + keys.length + ' keys';

    if (keys.length === 0) {
      listEl.innerHTML = '<li style="color:#666;cursor:default">无匹配 Key</li>';
      return;
    }

    listEl.innerHTML = keys.map(k => {
      const type = guessKeyType(k);
      return `<li onclick="selectKey('${escapeHtml(k)}')" data-key="${escapeHtml(k)}">
        <span class="key-type ${type}">${type}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(k)}</span>
      </li>`;
    }).join('');
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '连接失败';
    listEl.innerHTML = '<li style="color:#f44336;cursor:default">连接失败: ' + escapeHtml(e.message) + '</li>';
  }
}

function guessKeyType(key) {
  if (key.startsWith('payment:') && key.endsWith(':list')) return 'list';
  if (key.startsWith('payment:')) return 'string';
  if (key.startsWith('trial:')) return 'string';
  if (key.startsWith('health:')) return 'string';
  return 'string';
}

// === 选中 Key 查看详情 ===
async function selectKey(key) {
  document.querySelectorAll('.key-list li').forEach(li => li.classList.remove('active'));
  const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
  if (el) el.classList.add('active');

  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载中...</div>';

  try {
    // 尝试 TYPE 命令
    let type = 'string';
    try { type = await redisCmd('/type/' + key); } catch(e) {}

    if (type === 'list') {
      await renderList(key, content);
    } else {
      await renderString(key, content);
    }
  } catch (e) {
    content.innerHTML = `<div class="empty"><p style="color:#f44336">❌ 加载失败</p><p>${escapeHtml(e.message)}</p></div>`;
  }
}

// === 渲染 string 类型 ===
async function renderString(key, content) {
  const val = await redisCmd('/get/' + key);
  let parsed = null;
  let isJson = false;
  try {
    parsed = JSON.parse(val);
    isJson = typeof parsed === 'object' && parsed !== null;
  } catch(e) {}

  content.innerHTML = `
    <h2>${escapeHtml(key)}</h2>
    <div class="actions">
      <button class="primary" onclick="editValue('${escapeHtml(key)}')">✏️ 编辑</button>
      <button onclick="selectKey('${escapeHtml(key)}')">🔄 刷新</button>
      <button class="danger" onclick="delKey('${escapeHtml(key)}')">🗑️ 删除</button>
    </div>
    <div class="data-card">
      <div class="label">类型</div>
      <div class="value">string</div>
    </div>
    <div class="data-card">
      <div class="label">原始值</div>
      <div class="value">${escapeHtml(val === null ? '(nil)' : String(val))}</div>
    </div>
    ${isJson ? `
    <div class="data-card">
      <div class="label">JSON 格式化</div>
      <div class="value json">${escapeHtml(JSON.stringify(parsed, null, 2))}</div>
    </div>` : ''}
  `;
}

// === 渲染 list 类型 ===
async function renderList(key, content) {
  const val = await redisCmd('/lrange/' + key + '/0/-1');
  const items = Array.isArray(val) ? val : [];

  content.innerHTML = `
    <h2>${escapeHtml(key)}</h2>
    <div class="actions">
      <button onclick="selectKey('${escapeHtml(key)}')">🔄 刷新</button>
      <button class="danger" onclick="delKey('${escapeHtml(key)}')">🗑️ 删除整个 List</button>
    </div>
    <div class="data-card">
      <div class="label">类型 / 长度</div>
      <div class="value">list · ${items.length} 项</div>
    </div>
    <div style="margin-top:12px">
      ${items.length === 0 ? '<div class="empty"><p>空列表</p></div>' : items.map((item, i) => {
        let parsed = null;
        try { parsed = JSON.parse(item); } catch(e) {}
        return `<div class="list-item">
          <span class="idx">${i}</span>
          <div class="val">${escapeHtml(item)}</div>
          ${parsed ? `<button class="del-btn" onclick='showJson(${JSON.stringify(JSON.stringify(parsed, null, 2))})'>📄</button>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

// === 编辑值 ===
function editValue(key) {
  const content = document.getElementById('content');
  const current = content.querySelector('.data-card .value');
  const rawVal = current ? current.textContent : '';

  content.innerHTML = `
    <h2>编辑: ${escapeHtml(key)}</h2>
    <div class="data-card">
      <div class="label">新值</div>
      <textarea class="editor" id="editArea">${escapeHtml(rawVal)}</textarea>
    </div>
    <div class="actions">
      <button class="primary" onclick="saveValue('${escapeHtml(key)}')">💾 保存</button>
      <button onclick="selectKey('${escapeHtml(key)}')">取消</button>
    </div>
  `;
}

async function saveValue(key) {
  const val = document.getElementById('editArea').value;
  try {
    await redisCmd('/set/' + key, 'POST', val);
    toast('保存成功', 'success');
    selectKey(key);
  } catch(e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

// === 删除 Key ===
async function delKey(key) {
  if (!confirm('确认删除 Key: ' + key + ' ?')) return;
  try {
    await redisCmd('/del/' + key, 'POST');
    toast('删除成功', 'success');
    scanKeys();
    document.getElementById('content').innerHTML = '<div class="empty"><p style="font-size:32px">🗑️</p><p>已删除</p></div>';
  } catch(e) {
    toast('删除失败: ' + e.message, 'error');
  }
}

// === JSON 查看 ===
function showJson(jsonStr) {
  alert(jsonStr);
}

// === Toast ===
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  setTimeout(() => el.className = 'toast', 2000);
}

// === HTML 转义 ===
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>

</body>
</html>
